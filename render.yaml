# Render Blueprint: 대시보드 New → Blueprint 에서 이 저장소를 선택하면 자동 생성됩니다.
services:
  - type: web
    name: metaverse-cathedral
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
